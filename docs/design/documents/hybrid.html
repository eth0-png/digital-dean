<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Документы: гибрид</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* Гибрид по critique.md. Из 21st взяты паттерны (не код): прогресс с role=progressbar,
     будущие этапы видны, пульсирующая точка текущего этапа, аватар сотрудника и «Прочитано». */
  .chip { padding: 11px 15px; }                       /* 44 px вместо 41 */
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .quick div { background: var(--soft); border-radius: 18px; padding: 12px 4px 10px; display: grid; justify-items: center; gap: 7px; text-align: center; font-size: 12px; font-weight: 700; line-height: 1.2; min-height: 92px; }
  .quick b { width: 40px; height: 40px; border-radius: 13px; background: #fff; color: var(--brand); display: grid; place-items: center; }
  .need { border-radius: 20px; padding: 14px; background: var(--warn-soft); border: 1px solid #f6d7a7; }
  .need .row, .app .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .answer { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 14px; background: #fff; font-weight: 800; margin-top: 10px; }
  .app { border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
  .bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 12px; }
  .bar span { height: 6px; border-radius: 3px; background: var(--line); }
  .bar span.on { background: var(--grad); }
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 16px; padding: 4px; }
  .seg div { position: relative; z-index: 1; display: grid; place-items: center; min-height: 46px; font-weight: 800; font-size: 14px; color: var(--muted); }
  .seg div.on { color: var(--ink); }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: #fff; border-radius: 12px; box-shadow: 0 2px 10px -2px rgba(23,17,46,.18); }
  .check { border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
  .sticky { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px; background: linear-gradient(rgba(255,255,255,0), #fff 28%); }
  .status { border-radius: 26px; padding: 16px; color: #fff; background: var(--grad); box-shadow: 0 16px 32px -14px rgba(91,61,245,.6); }
  .tag { background: rgba(0,0,0,.2); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; }
  .steps { display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; margin-top: 16px; }
  .steps .dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .steps .dot.now { box-shadow: 0 0 0 5px rgba(255,255,255,.3); }
  .steps .dot.wait { background: transparent; border: 2px solid #fff; }
  .steps .ln { height: 3px; border-radius: 2px; background: #fff; margin: 0 6px; }
  .steps .ln.wait { background: repeating-linear-gradient(90deg, #fff 0 6px, transparent 6px 11px); }
  .lbl { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 12px; font-weight: 800; margin-top: 7px; }
  .lbl span:nth-child(2) { text-align: center; } .lbl span:nth-child(3) { text-align: right; }
  .lbl .wait { font-weight: 600; }
  .chat { display: grid; gap: 8px; }
  .sys { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
  .from { display: flex; gap: 8px; align-items: flex-end; }
  .ava { width: 32px; height: 32px; border-radius: 50%; background: #e0dbff; color: var(--brand); font-size: 12px; font-weight: 800; display: grid; place-items: center; flex: none; }
  .b { max-width: 82%; padding: 10px 12px; border-radius: 18px; font-size: 14px; }
  .b.them { background: var(--soft); border-bottom-left-radius: 6px; }
  .b.me { background: var(--brand); color: #fff; margin-left: auto; border-bottom-right-radius: 6px; }
  .read { text-align: right; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .reply { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 16px; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .reply .in { flex: 1; min-height: 48px; border-radius: 16px; background: var(--soft); display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-size: 16px; }
  .reply .go { width: 48px; height: 48px; border-radius: 16px; background: var(--grad); color: #fff; display: grid; place-items: center; }
  .paper { position: relative; background: #fff; border: 1px solid #e4e0f0; border-radius: 8px; padding: 16px; box-shadow: 0 14px 30px -18px rgba(23,17,46,.45); overflow: hidden; }
  .paper .line { height: 6px; border-radius: 3px; background: #ece9f4; margin-top: 7px; }
  .wm { position: absolute; left: -10px; right: -10px; top: 70px; text-align: center; transform: rotate(-16deg); font: 700 44px Unbounded, sans-serif; color: rgba(196,50,10,.11); letter-spacing: .1em; }
</style>
</head>
<body>
<div class="board">

<figure class="phone"><figcaption>1. Документы</figcaption><div class="screen">
  <div class="top"><div class="brand"><svg width="36" height="36" viewBox="0 0 36 36"><rect width="36" height="36" rx="11" fill="#6a3bf2"/><path d="M12 8.5h8l5 5V25a2.5 2.5 0 0 1-2.5 2.5h-10.5A2.5 2.5 0 0 1 9.5 25V11A2.5 2.5 0 0 1 12 8.5Z" fill="none" stroke="#fff" stroke-width="2.2"/><path d="m13.5 19 3 3 5.5-5.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="26.5" cy="9.5" r="3.5" fill="#FFB547"/></svg>деканат</div><div class="round"><i data-i="bell"></i></div><div class="round avatar">АС</div></div>
  <div class="content" style="display:grid;gap:16px">
    <h1 class="display">Документы</h1>
    <div class="quick">
      <div><b><i data-i="doc"></i></b>Справка об&nbsp;обучении</div>
      <div><b><i data-i="shield"></i></b>Для военкомата</div>
      <div><b><i data-i="redo"></i></b>Пересдача</div>
      <div><b><i data-i="edit"></i></b>Ошибка в&nbsp;данных</div>
    </div>
    <div class="need"><div class="row"><div><div class="bold">Заявление на пересдачу</div><div class="small muted">№ 2477, макроэкономика</div></div><span class="pill warn">Нужен ответ</span></div>
      <p class="small" style="margin-top:8px">Деканат спрашивает удобную дату пересдачи.</p>
      <span class="answer"><i data-i="msg" style="width:18px;height:18px"></i>Ответить деканату</span></div>
    <section style="display:grid;gap:10px"><h2 class="display" style="margin:0">Мои заявки</h2>
      <div class="app"><div class="row"><div><div class="bold">Справка об обучении</div><div class="small muted">№ 2481, на работу</div></div><span class="pill work">В работе</span></div>
        <div class="bar" role="progressbar" aria-valuetext="В работе, этап 2 из 3"><span class="on"></span><span class="on"></span><span></span></div>
        <p class="small" style="margin-top:8px;display:flex;gap:6px;align-items:center"><i data-i="clock" style="width:16px;height:16px"></i>Будет готово до 12 ноября</p></div>
      <div class="app" style="display:flex;justify-content:space-between;align-items:center"><div><div class="bold">Справка для военкомата</div><div class="small muted">№ 2460, готово 5 ноября</div></div><span class="pill ok">Готово</span></div>
    </section>
    <p class="small muted" style="display:flex;gap:6px;align-items:center"><i data-i="pin" style="width:16px;height:16px"></i>Деканат МП: каб. 2105, пн–пт 10:00–17:00</p>
  </div>
  <div class="nav"><a><i data-i="home"></i>Сегодня</a><a><i data-i="cal"></i>Расписание</a><a><i data-i="cap"></i>Учёба</a><a class="on"><i data-i="doc"></i>Документы</a></div>
</div></figure>

<figure class="phone"><figcaption>2. Оформление в одно касание</figcaption><div class="screen">
  <div class="back"><i data-i="back"></i>Документы</div>
  <div class="content" style="display:grid;gap:20px">
    <div><h1 class="display">Справка об обучении</h1><p class="muted" style="margin-top:6px">Подтверждает, что вы учитесь. Обычно готовят за 1 рабочий день.</p></div>
    <div><p class="bold small" style="margin-bottom:8px">Куда нужна справка</p><div class="chips"><span class="chip on">На работу</span><span class="chip">В военкомат</span><span class="chip">В соцзащиту</span><span class="chip">Для визы</span><span class="chip">Другое</span></div></div>
    <div><p class="bold small" style="margin-bottom:8px">Формат</p><div class="seg"><span class="thumb"></span><div class="on">Электронная с QR</div><div>Бумажная</div></div><p class="small muted" style="margin-top:8px">Можно показать с телефона или отправить ссылкой.</p></div>
    <div class="check"><p class="small muted bold">Проверьте данные</p><p style="margin-top:4px">Соколова Анна Дмитриевна<br>3 курс, МП-31</p><p class="small" style="margin-top:6px;color:var(--brand);font-weight:800">Нашли ошибку в данных?</p></div>
  </div>
  <div class="sticky"><div class="btn">Отправить заявку</div></div>
</div></figure>

<figure class="phone"><figcaption>3. Деканат задал вопрос</figcaption><div class="screen">
  <div class="back"><i data-i="back"></i>Документы</div>
  <div class="content" style="display:grid;gap:14px">
    <section class="status"><div style="display:flex;justify-content:space-between"><span class="tag">Справка об обучении</span><span class="tag">№ 2481</span></div>
      <p class="display" style="font-size:21px;font-weight:600;margin-top:12px">Нужно уточнение</p>
      <p style="opacity:.95;font-size:14px">Ответьте, и справку продолжат готовить</p>
      <div class="steps" role="progressbar" aria-valuetext="Нужно уточнение, этап 2 из 3"><span class="dot"></span><span class="ln"></span><span class="dot now"></span><span class="ln wait"></span><span class="dot wait"></span></div>
      <div class="lbl"><span>Принята</span><span>В работе</span><span class="wait">Готово</span></div></section>
    <div class="chat">
      <p class="sys">10 ноября, 09:12. Заявка принята</p>
      <div class="from"><span class="ava">МК</span><div class="b them"><div class="small bold" style="color:var(--brand)">Марина, деканат</div>Здравствуйте! Для какой организации нужна справка? Если для банка, сделаем с печатью.</div></div>
    </div>
  </div>
  <div class="reply"><div class="in">Ваш ответ</div><div class="go"><i data-i="send"></i></div></div>
</div></figure>

<figure class="phone"><figcaption>4. Готово: документ и история</figcaption><div class="screen">
  <div class="back"><i data-i="back"></i>Документы</div>
  <div class="content" style="display:grid;gap:14px">
    <section class="status"><div style="display:flex;justify-content:space-between"><span class="tag">№ 2481</span><span class="pill ok">Готово</span></div>
      <p class="display" style="font-size:21px;font-weight:600;margin-top:10px">Справка готова</p>
      <p style="opacity:.95;font-size:14px">11 ноября в 14:20, на 1 день раньше срока</p>
      <div class="steps" role="progressbar" aria-valuetext="Готово, этап 3 из 3"><span class="dot"></span><span class="ln"></span><span class="dot"></span><span class="ln"></span><span class="dot"></span></div>
      <div class="lbl"><span>Принята</span><span>В работе</span><span>Готово</span></div></section>
    <div class="paper">
      <div class="small muted bold">ДЕКАНАТ МЕЖДУНАРОДНО-ПРАВОВОГО ФАКУЛЬТЕТА</div>
      <div class="display" style="font-size:15px;font-weight:600;margin-top:8px">СПРАВКА № 2481</div>
      <div class="small">Дана Соколовой Анне Дмитриевне в том, что она обучается на 3 курсе.</div>
      <div class="line"></div><div class="line" style="width:70%"></div>
      <div style="display:flex;justify-content:space-between;align-items:end;margin-top:10px"><span class="demo">ДЕМО, ЮРИДИЧЕСКОЙ<br>СИЛЫ НЕ ИМЕЕТ</span><svg class="qr" style="width:74px;height:74px"></svg></div>
      <div class="wm">ДЕМО</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="btn" style="font-size:15px"><i data-i="doc"></i>Открыть</div><div class="btn ghost" style="font-size:15px"><i data-i="qr"></i>QR-код</div></div>
    <div class="chat">
      <div class="b me">Для банка, нужна печать</div><p class="read">Прочитано 11:42</p>
      <p class="sys">11 ноября, 14:20. Готово</p>
    </div>
  </div>
</div></figure>

</div>
<script src="mock.js"></script>
</body>
</html>
